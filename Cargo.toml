[package]
name = "oncep"
version = "0.1.0"
edition = "2021"
description = "TCP port scanner with per-port confidence and an ETA"
authors = ["Mexsic"]
homepage = "https://mexsic.io"
license = "MIT"

[[bin]]
name = "oncep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
